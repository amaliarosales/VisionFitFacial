<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionFit Facial Yoga</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
    <h1>VisionFit Facial Yoga ⚡</h1>
    <div class="capture-zone">
        <select id="exercise-selector"></select>
        <div class="stat-box"><span id="val-reps">0</span><br>REPS</div>
        <div class="video-container">
            <video id="webcam" style="display:none;"></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
